# Settings of the real Spring Boot application while the Playwright tests run against it.
# playwright.config.js starts the jar with --spring.profiles.active=test --spring.config.additional-location=optional:file:./e2e/
# so this file wins over the application.properties inside the jar. The tests read the plugged.* values below to know what to expect.

# every run starts with an empty in-memory database
spring.datasource.url=jdbc:h2:mem:e2e;DB_CLOSE_DELAY=-1

# Info page: a fixed donate link and contact address (the real ones would make the tests depend on the production settings)
plugged.donate.paypal-url=https://www.paypal.com/donate/?hosted_button_id=E2ETEST
plugged.admin.email=e2e@example.be

# No logging on the console: Playwright pipes the output of the application into its own report. To see it, run with E2E_LOG=1
# (playwright.config.js then passes --logging.threshold.console=TRACE).
logging.threshold.console=OFF
spring.main.banner-mode=off

# The first start: the fixtures create the administrator with this setup key (normally a random key printed in the log)
plugged.setup.key=e2e-setup-key
# Every request of the tests comes from 127.0.0.1: no limit per address
plugged.auth.ip-max-attempts=100000
