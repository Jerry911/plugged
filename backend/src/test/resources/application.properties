# Every Spring context of the tests (one per combination of @SpringBootTest properties, cached for the classes that share it) gets a database of
# its own. With one shared database a context that starts later drops and recreates the tables under the contexts that are still cached, whose
# pre-fetched blocks of sequence numbers (project_versions, project_doc) then hand out numbers that are already in use.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# No banner; the logging of the tests is in logback-test.xml (nothing on the console unless mvn test -Dplugged.test.log=DEBUG)
spring.main.banner-mode=off

# The setup key of the first start (normally random and printed in the log), so the tests can create the administrator
plugged.setup.key=test-setup-key
# All requests of the tests come from 127.0.0.1: no limit per address (LoginThrottleTest tests it with its own settings)
plugged.auth.ip-max-attempts=100000
