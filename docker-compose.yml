services:
  plugged:
    build: .
    image: plugged:latest
    ports:
      # host port: set PLUGGED_PORT in the shell or in a .env file next to this file (default 8080)
      - "${PLUGGED_PORT:-8080}:8080"
    environment:
      # address of the administrator (first start: Plugged asks for the details of this account) and of the contact form of the Info page;
      # set PLUGGED_ADMIN_EMAIL in the shell or in the .env file next to this file
      PLUGGED_ADMIN_EMAIL: ${PLUGGED_ADMIN_EMAIL:?set PLUGGED_ADMIN_EMAIL to the email address of the administrator}
    volumes:
      - plugged-data:/data
    restart: unless-stopped

volumes:
  plugged-data:
