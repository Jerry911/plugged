# Plugged as a program for one computer: the installers for Windows, macOS and Linux (desktop/jpackage.sh), each built on its own system.
#
# A release is made by raising the <version> in backend/pom.xml (the only place the version is written):
#   - a push to main (or master) that changes backend/pom.xml: when there is no release v<version> yet, the installers are built and published
#     as release v<version> (the tag is made on that commit). Another change of the pom (a dependency) with the same version does nothing.
#   - by hand (Actions > Desktop > Run workflow): the installers are built from the chosen branch and kept as artifacts of the run, nothing
#     is published (to try them first).
name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['backend/pom.xml']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: The version of backend/pom.xml, and whether it is released already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r' < backend/pom.xml | sed -n 's:^    <version>\([^<]*\)</version>:\1:p' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is new: it is built and released as v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $version: built without a release (by hand, or v$version exists already)"
          fi

  package:
    needs: version
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and pack
        shell: bash
        run: desktop/jpackage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugged-${{ needs.version.outputs.version }}-${{ runner.os }}
          path: |
            desktop/target/*.deb
            desktop/target/*.tar.gz
            desktop/target/*.zip
            desktop/target/*.msi
            desktop/target/*.dmg
          if-no-files-found: error

  release:
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Plugged ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: installers/*
