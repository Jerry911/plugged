# Plugged as a program for one computer: the installers for Windows, macOS and Linux (desktop/jpackage.sh), each built on its own system.
#
# A release is made by raising the <version> in backend/pom.xml (the only place the version is written):
#   - every push to main (or master) looks at that version (a few seconds): when there is no release v<version> yet, the installers are
#     built and published as release v<version> (the tag is made on that commit). When the release exists already, nothing else runs.
#     So a release that failed is made by the next push that fixes it.
#   - by hand (Actions > Desktop > Run workflow): the installers are built from the chosen branch and kept as artifacts of the run, nothing
#     is published (to try them first).
name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: The version of backend/pom.xml, and whether it is released already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r' < backend/pom.xml | sed -n 's:^    <version>\([^<]*\)</version>:\1:p' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is new: it is built and released as v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $version: built without a release (by hand, or v$version exists already)"
          fi

  package:
    needs: version
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # The Maven repository of the last build, also when the pom changed: raising the version changes the pom, and without the old cache
      # every system downloads everything from Maven Central at once, which then answers 429 Too Many Requests.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build and pack
        shell: bash
        # Maven retries a download that is refused for a while (429 / 503) longer than its default; a build that still fails on the
        # network is tried again after a pause, up to three times (what was downloaded stays).
        env:
          MAVEN_ARGS: >-
            -Daether.connector.http.retryHandler.count=6
            -Daether.connector.http.retryHandler.interval=10000
            -Daether.transport.http.retryHandler.count=6
            -Daether.transport.http.retryHandler.interval=10000
        # through bash: the script works without its execute permission (a checkout from Windows or a zip loses it)
        run: |
          for attempt in 1 2 3; do
            bash desktop/jpackage.sh && exit 0
            [ "$attempt" = 3 ] || { echo "::warning::Build attempt $attempt failed, trying again in 2 minutes"; sleep 120; }
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: plugged-${{ needs.version.outputs.version }}-${{ runner.os }}
          path: |
            desktop/target/*.deb
            desktop/target/*.tar.gz
            desktop/target/*.zip
            desktop/target/*.msi
            desktop/target/*.dmg
          if-no-files-found: error

  release:
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      # The notes of the release: the section of this version in CHANGELOG.md ("## [1.0.3] - ..." up to the next "## ["); without one, a
      # pointer to the file. GitHub adds the list of changes since the previous release under it.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tr -d '\r' < CHANGELOG.md | awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }' > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Plugged ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: installers/*
