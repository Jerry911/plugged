# HTTP port: PORT (or SERVER_PORT) env var, or --server.port=..., overrides this default of 8080
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/plugged
spring.jpa.hibernate.ddl-auto=update

# Info page
# PayPal donate link of the donate button (env var PLUGGED_PAYPAL_URL overrides it; empty = button disabled)
plugged.donate.paypal-url=${PLUGGED_PAYPAL_URL:https://www.paypal.com/donate/?hosted_button_id=RB652LRR3M83U}
# Address of the administrator (env var PLUGGED_ADMIN_EMAIL).
#  - The administrator account: on the first start (no administrator yet) the application asks for the details of the administrator,
#    whose email address is this one and cannot be changed. Required: without it no administrator can be created and nobody can sign in.
#  - The contact form of the Info page writes to it. The form only opens the visitor's own mail program (mailto:),
#    the application never sends mail itself. Empty = the contact form is hidden.
plugged.admin.email=${PLUGGED_ADMIN_EMAIL:}

# Signing in: how long a session lasts without any request (env var PLUGGED_SESSION_TIMEOUT, e.g. 30m, 8h). When it has expired the editor
# asks to sign in again on top of the open project, so nothing unsaved is lost. Sessions live in memory: a restart signs everybody out.
server.servlet.session.timeout=${PLUGGED_SESSION_TIMEOUT:8h}
server.servlet.session.cookie.same-site=lax

# Logging (logback, see logback-spring.xml)
# Level of the application itself: DEBUG logs every API call (request, outcome, duration); TRACE also the (truncated) request bodies;
# INFO only the changes (saved/deleted); env var PLUGGED_LOG_LEVEL overrides it.
logging.level.com.pleysje.plugged=${PLUGGED_LOG_LEVEL:DEBUG}
# Directory of the log file when the profile "file" is active (spring.profiles.active=file)
plugged.log.dir=${PLUGGED_LOG_DIR:logs}

