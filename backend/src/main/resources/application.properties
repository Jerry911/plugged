# HTTP port: PORT (or SERVER_PORT) env var, or --server.port=..., overrides this default of 8080
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/plugged
spring.jpa.hibernate.ddl-auto=update

# Info page
# PayPal donate link of the donate button (env var PLUGGED_PAYPAL_URL overrides it; empty = button disabled)
plugged.donate.paypal-url=${PLUGGED_PAYPAL_URL:https://www.paypal.com/donate/?hosted_button_id=RB652LRR3M83U}
# Address of the administrator (env var PLUGGED_ADMIN_EMAIL).
#  - The administrator account: on the first start (no administrator yet) the application asks for the details of the administrator,
#    whose email address is this one and cannot be changed. Required: without it no administrator can be created and nobody can sign in.
#  - The contact form of the Info page writes to it. The form only opens the visitor's own mail program (mailto:),
#    the application never sends mail itself. Empty = the contact form is hidden.
plugged.admin.email=${PLUGGED_ADMIN_EMAIL:}

# Signing in: how long a session lasts without any request (env var PLUGGED_SESSION_TIMEOUT, e.g. 30m, 8h). When it has expired the editor
# asks to sign in again on top of the open project, so nothing unsaved is lost. Sessions live in memory: a restart signs everybody out.
server.servlet.session.timeout=${PLUGGED_SESSION_TIMEOUT:8h}
server.servlet.session.cookie.same-site=lax
# Behind a reverse proxy (nginx, Traefik, Caddy, ...) that terminates HTTPS: trust its X-Forwarded-* headers, so the requests count as
# HTTPS (cookies get the Secure flag, HSTS is sent) and the address of the visitor is the real one (sign-in limits). Tomcat only trusts them
# from internal addresses (10.x, 172.16-31.x, 192.168.x, 127.x); without a proxy nothing changes. Env var PLUGGED_FORWARD_HEADERS (none = off).
server.forward-headers-strategy=${PLUGGED_FORWARD_HEADERS:native}
# Force the Secure flag on the session cookie (env var PLUGGED_SECURE_COOKIES=true), also when the request does not look like HTTPS.
# Leave false for a local setup over plain http://localhost (a Secure cookie is not sent over http, so signing in would not work).
server.servlet.session.cookie.secure=${PLUGGED_SECURE_COOKIES:false}
# Content-Security-Policy of every answer (env var PLUGGED_CSP; empty = no header). Plugged only loads its own scripts and styles.
plugged.content-security-policy=${PLUGGED_CSP:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'}

# First start: the setup key that is needed to create the administrator account. Empty = a new random key at every start, printed in the
# log (console). Set it (env var PLUGGED_SETUP_KEY) only for automated installations.
plugged.setup.key=${PLUGGED_SETUP_KEY:}

# Signing in: after this many wrong passwords in a row an account is locked for plugged.auth.lockout (an administrator can unlock it
# earlier under Beheer > Gebruikers). Env vars PLUGGED_MAX_FAILED_LOGINS and PLUGGED_LOCKOUT.
plugged.auth.max-failed-logins=${PLUGGED_MAX_FAILED_LOGINS:5}
plugged.auth.lockout=${PLUGGED_LOCKOUT:15m}
# Per network address: at most this many failed sign-ins, first starts and registrations per window (then 429 until the window has passed).
plugged.auth.ip-max-attempts=${PLUGGED_IP_MAX_ATTEMPTS:30}
plugged.auth.ip-window=${PLUGGED_IP_WINDOW:15m}

# Limits: the largest request body of the API (a project document; 413 above it) and the number of projects a user may own (0 = no limit)
plugged.max-request-size=${PLUGGED_MAX_REQUEST_SIZE:5MB}
plugged.max-projects-per-user=${PLUGGED_MAX_PROJECTS_PER_USER:500}

# Logging (logback, see logback-spring.xml)
# Level of the application itself: DEBUG logs every API call (request, outcome, duration); TRACE also the (truncated) request bodies;
# INFO only the changes (saved/deleted); env var PLUGGED_LOG_LEVEL overrides it.
logging.level.com.pleysje.plugged=${PLUGGED_LOG_LEVEL:DEBUG}
# Directory of the log file when the profile "file" is active (spring.profiles.active=file)
plugged.log.dir=${PLUGGED_LOG_DIR:logs}

# Projects: how many saved versions of every project are kept as its history (0 = no history), how many days a deleted project stays in
# the trash before it is removed for good (0 = never), and after how long without a heartbeat an open editor no longer counts as present.
plugged.project-history=${PLUGGED_PROJECT_HISTORY:50}
plugged.trash-days=${PLUGGED_TRASH_DAYS:30}
plugged.presence-timeout=${PLUGGED_PRESENCE_TIMEOUT:90s}
