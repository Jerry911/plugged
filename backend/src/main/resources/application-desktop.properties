# Plugged as a program on one computer (started by com.pleysje.plugged.desktop.DesktopLauncher with --desktop, which sets the port and
# plugged.desktop.data-dir: the data folder of the user, or env var PLUGGED_HOME). One local account, no sign-in screen; see DesktopMode.
plugged.desktop.enabled=true
# only this computer can reach it
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:${plugged.desktop.data-dir}/plugged
plugged.log.dir=${plugged.desktop.data-dir}/logs
# the local account (never written to: the program does not send mail, and the contact form of the Info page is hidden)
plugged.admin.email=lokaal@plugged.desktop
# a session as long as a working month; the program signs the browser in again at every start
server.servlet.session.timeout=30d
server.forward-headers-strategy=none
plugged.max-projects-per-user=0
spring.main.banner-mode=off
